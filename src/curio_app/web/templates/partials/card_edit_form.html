<section id="draft-{{ card.id }}" class="card card-draft is-editing">
  <form hx-post="/questions/{{ question_id }}/cards/{{ card.id }}/edit"
    hx-target="#draft-{{ card.id }}" hx-swap="outerHTML" hx-disabled-elt="find button" class="stack">
    <input type="hidden" name="edit_submitted" value="1">
    {% if error %}
    <div class="alert alert-error" role="alert"><p>{{ error }}</p></div>
    {% endif %}
    <label class="field">
      <span class="field-label">Type</span>
      <select name="type_value">
        {% for value, label in card_types %}
        <option value="{{ value }}"{% if value == card.type.value %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span class="field-label">Front (question)</span>
      <textarea name="front" maxlength="300" required>{{ card.front }}</textarea>
    </label>
    <label class="field">
      <span class="field-label">Back (answer)</span>
      <textarea name="back" maxlength="1000" required>{{ card.back }}</textarea>
    </label>
    <label class="field">
      <span class="field-label">Source (optional)</span>
      <input type="text" name="source" maxlength="120" value="{{ card.source or '' }}">
    </label>
    <div class="card-actions">
      <button type="submit" class="btn btn-primary">Save</button>
      <button type="button" class="btn" hx-get="/questions/{{ question_id }}/cards/{{ card.id }}"
        hx-target="#draft-{{ card.id }}" hx-swap="outerHTML" hx-disabled-elt="this">Cancel</button>
    </div>
  </form>
</section>
