<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Lernsystem{% endblock %}</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lernsystem">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <script defer src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/sse.js"></script>
  <script defer src="/static/vendor/katex/katex.min.js"></script>
  <script defer src="/static/vendor/katex/auto-render.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">{% block header_title %}{{ self.title() }}{% endblock %}</h1>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
  <nav class="tab-bar" aria-label="Main navigation">
    <a href="/" class="tab{% if active_tab == 'inbox' %} is-active{% endif %}"{% if active_tab == 'inbox' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span>Inbox</span>
    </a>
    <a href="/generate" class="tab{% if active_tab == 'generate' %} is-active{% endif %}"{% if active_tab == 'generate' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
      <span>Generate</span>
    </a>
    <a href="/books" class="tab{% if active_tab == 'books' %} is-active{% endif %}"{% if active_tab == 'books' %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
      <span>Books</span>
    </a>
  </nav>
</body>
</html>
