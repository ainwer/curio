# Curio: app + Docling converter behind a Tailscale sidecar.
# All secrets and host paths come from .env (see .env.example); nothing secret lives here.
name: curio

services:
  tailscale:
    image: tailscale/tailscale:v1.104.2
    hostname: ${TS_HOSTNAME:-curio}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-curio}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  app:
    build: .
    # Share the sidecar's network namespace: the app is reachable only through
    # `tailscale serve` (HTTPS inside the tailnet). No ports are published.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file: .env
    environment:
      # Container paths override the host paths from .env.
      VAULT_PATH: /vault
      DATA_PATH: /data
      VAULT_SSH_KEY_FILE: /run/secrets/vault_deploy_key
      VAULT_KNOWN_HOSTS_FILE: /app/deploy/known_hosts
      CONVERTER_URL: http://converter:8001
    volumes:
      - ${VAULT_PATH:?set VAULT_PATH in .env}:/vault
      - ${DATA_PATH:?set DATA_PATH in .env}:/data
      - ${VAULT_DEPLOY_KEY_PATH:?set VAULT_DEPLOY_KEY_PATH in .env}:/run/secrets/vault_deploy_key:ro
    restart: unless-stopped

  converter:
    build: ./converter
    environment:
      BOOKS_PATH: /data/books
    volumes:
      - ${DATA_PATH:?set DATA_PATH in .env}/books:/data/books
      - converter-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  converter-cache:
